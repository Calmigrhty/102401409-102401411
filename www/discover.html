<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>探索发现 - 校园失物招领</title>
  <link rel="stylesheet" href="css/common.css"> 
  <link rel="stylesheet" href="css/home.css">   
  <link rel="stylesheet" href="css/discover.css">
</head>

<body>
  <div class="app">
    <header class="home-header">
      <h1>探索发现</h1>
    </header>

    <main>
      <!-- 搜索框 -->
      <div class="search-container">
        <div class="search-box">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="search-input" placeholder="搜索物品名称">
          <!-- 这里放了一个关闭的小叉叉图标，你可以选择隐藏或实现清空功能 -->
          <svg viewBox="0 0 24 24" style="width:16px; height:16px; cursor:pointer;" id="clear-search"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </div>
      </div>

      <!-- 分类标签 -->
      <div class="filter-tabs" id="discover-filters">
        <button class="filter-btn active" data-category="all">全部类别</button>
        <button class="filter-btn" data-category="数码电子">数码电子</button>
        <button class="filter-btn" data-category="日常用品">日常用品</button>
        <button class="filter-btn" data-category="卡片证件">卡片证件</button>
        <button class="filter-btn" data-category="交通工具">交通工具</button>
        <button class="filter-btn" data-category="其他">其他</button>
      </div>

      <!-- 卡片列表 -->
      <div id="discover-post-list" class="post-list"></div>
    </main>

    <!-- 底部导航栏 -->
    <nav class="bottom-nav">
      <a href="index.html">
        <svg viewBox="1 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>首页</span>
      </a>
      <a href="discover.html" class="active">
        <svg viewBox="1 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm2.19 12.19L6 18l3.81-8.19L18 6l-3.81 8.19z"/></svg>
        <span>发现</span>
      </a>
      <a href="publish.html">
        <svg viewBox="1 0 24 24"><path d="M20 14h-6v6h-4v-6H4v-4h6V4h4v6h6v4z"/></svg>
        <span>发布</span>
      </a>
      <a href="profile.html">
        <svg viewBox="1 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span>我的</span>
      </a>
    </nav>
  </div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/discover.js"></script>
</body>
</html>
